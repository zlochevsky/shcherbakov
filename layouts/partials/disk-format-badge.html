{{- /* Аргументы: dict "key" (cd|mp3|da) "label" */ -}}
<span class="disk-format-badge disk-format-{{ .key }}">
	{{- if eq .key "da" -}}
	<svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><path d="M7.5 1.6v7.4M4.4 6l3.1 3.1L10.6 6M2.4 12.6h10.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
	{{- else -}}
	<svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="7.5" cy="7.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
	{{- end }}
	{{ .label }}
</span>
