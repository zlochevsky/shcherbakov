{{- /* Дата пункта меню: «дд.мм.гг»; первые две цифры года — в .century, на узких экранах (дата под ссылкой мелким
   шрифтом, common.css) они показываются: «дд.мм.гггг» */ -}}
<span class="datum">{{ time.Format "02.01." . }}<span class="century">{{ substr (time.Format "2006" .) 0 2 }}</span>{{ time.Format "06" . }}</span>
