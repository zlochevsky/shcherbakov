<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "headbasic.html" . }}

<style>
body { background-color: khaki; color: #333300; }
a:link { color: #000090; }
a:visited { color: #555522; }
h1, h2 { color: #333300; }
main { max-width: 60em; margin: 0 auto; padding: 0 1em; box-sizing: border-box; }
main img { max-width: 100%; height: auto; }
main ul { padding-left: 1.3em; }
main li { margin: .5em 0; }
.page-subtitle { font-style: italic; color: #666644; margin-top: .2em; padding-left: 0; }
{{ if .Params.centerText }}
main p, main h2 { text-align: center; padding-left: 0; }
{{ end }}
</style>

</head>
<body>
<header>
<a name="top"> </a>
<ul class="cornernav">
	<li>[<a href="{{ "index.html" | relURL }}">На главную страницу</a>]</li>
	<li>[<a href="{{ "Images/index.html" | relURL }}">Картинки</a>]</li>
	<li>[<a href="{{ "fans/index.html" | relURL }}">Фан-клуб</a>]</li>
	<li>[<a href="{{ "Disks/index.html" | relURL }}">Дискография</a>]</li>
</ul>
<h1>{{ .Title }}</h1>
{{ with .Params.subtitle }}<p class="page-subtitle">{{- . -}}</p>{{ end -}}
</header>
<main>
{{ .Content }}
</main>
<ul class="cornernav">
	<li>[<a href="#top">Наверх</a>]</li>
	<li>[<a href="{{ "index.html" | relURL }}">На главную страницу</a>]</li>
</ul>
</body>
</html>
