<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "headbasic.html" . }}
  <link rel="canonical" href="{{ .Permalink }}">

<style>
body { background-color: #E1F0E2; color: #003300; }
a:link { color: #003300; }
a:visited { color: #5E7C64; }
a:hover { color: #005500; text-decoration: none; }
main { max-width: 60em; margin: 0 auto; padding: 0 1em; box-sizing: border-box; }
main img { max-width: 100%; height: auto; }
main p { padding-left: 0; }
h1 { text-align: center; }
.tape-cover { margin: 1em 0; text-align: center; }
.tape-sides { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 1.5em; margin: 1.5em 0; }
.tape-sides > section { min-width: 12em; }
.tape-sides > .tape-cover { margin: 0; }
.tape-sides h2 { font-size: 1em; margin: 0 0 .5em; padding-bottom: .3em; border-bottom: 1px solid #A2C4A7; }
.tape-sides ol { margin: 0; padding-left: 2em; }
.tape-sides li { margin: .15em 0; }
.tape-sides .time { margin-left: .5em; color: #5E7C64; }
.tape-credits { text-align: center; }
</style>

</head>
<body>
<header>
<a name="top"> </a>
<ul class="cornernav">
	<li>[<a href="{{ "index.html" | relURL }}">На главную страницу</a>]</li>
	<li>[<a href="{{ "catalogue.html" | relURL }}">Каталог песен</a>]</li>
	<li>[<a href="{{ "Disks/index.html" | relURL }}">Дискография</a>]</li>
</ul>
<h1>{{ .Title }}</h1>
</header>
<main>
{{ .Content }}
</main>
<ul class="cornernav">
	<li>[<a href="#top">Наверх</a>]</li>
	<li>[<a href="{{ "index.html" | relURL }}">На главную страницу</a>]</li>
	<li>[<a href="{{ "Disks/index.html" | relURL }}">Дискография</a>]</li>
</ul>
</body>
</html>
