# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Regular rebuild twice a day at 10:00 and 22:00 Orenburg time (UTC+5 -> 05:00/17:00 UTC)
  schedule:
    - cron: "0 5,17 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Directus недоступен или публичный токен не видит данных — сборку не продолжаем: Hugo при ошибке запроса
      # к Directus не падает, а собирает страницы с пустыми данными, и деплой опубликовал бы сайт без каталога,
      # концертов и дисков. Упавший workflow ничего не публикует — на сайте остаётся прежняя версия.
      # Список — коллекции, которые читает сборка и которые не бывают пустыми (announces и log_entries — бывают).
      - name: Check that Directus answers
        run: |
          TOKEN=$(jq -r .directus.token config/_default/params.json.example)
          URL=https://db.sch.com.ru/
          if ! curl -sf --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "${URL}server/ping" > /dev/null; then
            echo "::error::Directus (${URL}) не отвечает — сборка остановлена, на сайте остаётся прежняя версия"
            exit 1
          fi
          fail=0
          for c in works events perfs sets sets_entries disk_formats books books_entries book_sets translations translators languages performers releases recordings comments; do
            n=$(curl -sf --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors "${URL}items/${c}?limit=1&fields=id${TOKEN}" | jq '.data | length') || n=""
            if [ "$n" != "1" ]; then
              echo "::error::Directus: публичный токен не получил данных из «${c}» (нет доступа или коллекция пуста)"
              fail=1
            fi
          done
          exit $fail

      - name: Archive expired announces in Directus
        run: |
          curl -sf -X PATCH "https://db.sch.com.ru/items/announces" \
            -H "Authorization: Bearer ${{ secrets.DIRECTUS_ANNOUNCES_ARCHIVER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":{"filter":{"_and":[{"status":{"_eq":"published"}},{"expiry_date":{"_lt":"$NOW"}}]}},"data":{"status":"archived"}}'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Публичный токен только для чтения (опубликован в params.json.example): сайт с ним
      # собирается так же, как с приватным, поэтому отдельный секрет не нужен.
      - name: Create config with the public Directus token
        run: cp config/_default/params.json.example config/_default/params.json

      - name: Build
        run: hugo -d public --cleanDestinationDir

      # Граница «витрина / фан-клуб»: только предупреждения (аннотации), деплой
      # не блокирует. Чтобы сделать блокирующей — добавить --strict и убрать
      # continue-on-error. Исключения — в шапке scripts/check-separation.py.
      - name: Check showcase / fan-club separation
        continue-on-error: true
        run: python3 scripts/check-separation.py --github

      - name: Build search index
        run: npx --yes pagefind@^1 --site public

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
