# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Regular rebuild twice a day at 10:00 and 22:00 Orenburg time (UTC+5 -> 05:00/17:00 UTC)
  schedule:
    - cron: "0 5,17 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive expired announces in Directus
        run: |
          curl -sf -X PATCH "https://db.sch.com.ru/items/announces" \
            -H "Authorization: Bearer ${{ secrets.DIRECTUS_ANNOUNCES_ARCHIVER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":{"filter":{"_and":[{"status":{"_eq":"published"}},{"expiry_date":{"_lt":"$NOW"}}]}},"data":{"status":"archived"}}'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Create config with Directus token
        run: |
          mkdir -p config/_default
          echo '{"directus":{"token":"${{ secrets.DIRECTUS_TOKEN }}"}}' > config/_default/params.json

      - name: Build
        run: hugo -d public --cleanDestinationDir

      - name: Build search index
        run: npx --yes pagefind@^1 --site public

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
