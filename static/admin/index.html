<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Редактор сайта</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap">
<style>
/* Поле текста ведёт себя по-разному в зависимости от коллекции (атрибут data-collection у <html> ставит скрипт
   ниже по адресу #/collections/<имя>/…):
   - песни (texts) и переводы (tr-*): строки выровнены пробелами (аккорды справа) — моноширинный шрифт со своей
     кириллицей (иначе браузер берёт русские буквы из другого шрифта, их ширина не равна ширине пробела, и аккорды
     съезжают), без переноса строк, поля во всю ширину панели (у Sveltia — не шире 768px);
   - остальные страницы (проза): обычный шрифт, длинные строки переносятся по словам, как абзацы */
textarea {
	white-space: pre-wrap !important;
	line-height: 1.6 !important;
}
:root[data-collection="texts"] textarea,
:root[data-collection^="tr-"] textarea {
	font-family: "PT Mono", "DejaVu Sans Mono", Consolas, monospace !important;
	letter-spacing: 0 !important;
	word-spacing: 0 !important;
	line-height: normal !important;
	white-space: pre !important;
	overflow-x: auto !important;
}
:root[data-collection="texts"] section[role="group"].field > *,
:root[data-collection^="tr-"] section[role="group"].field > * { max-width: none !important; }
/* светлая тема: желтоватый фон (как Solarized Light) и тёмно-красные акценты; тёмная тема — как у Sveltia.
   Переменные — внутренние у Sveltia: если в новой версии их переименуют, вернутся стандартные цвета */
:root[data-theme=light] {
	--sui-background-color-1-hsl: 44 87% 97% !important;  /* поля ввода */
	--sui-background-color-2-hsl: 44 87% 94% !important;  /* основной фон, #fdf6e3 */
	--sui-background-color-3-hsl: 46 42% 89% !important;
	--sui-background-color-4-hsl: 46 42% 85% !important;
	--sui-background-color-5-hsl: 45 30% 78% !important;
	--sui-border-color-1-hsl: 45 20% 55% !important;
	--sui-border-color-2-hsl: 45 25% 68% !important;
	--sui-border-color-3-hsl: 45 30% 76% !important;
	--sui-primary-accent-color-text: hsl(0 65% 35%) !important;
	--sui-primary-accent-color-light: hsl(0 65% 42%) !important;
	--sui-primary-accent-color: hsl(0 65% 35%) !important;
	--sui-primary-accent-color-dark: hsl(0 65% 28%) !important;
	--sui-primary-accent-color-translucent: hsl(0 65% 45% / 60%) !important;
	--sui-primary-accent-color-translucent-light: hsl(0 65% 45% / 40%) !important;
}
@media (prefers-color-scheme: light) {
	:root:not([data-theme]) {
		--sui-background-color-1-hsl: 44 87% 97% !important;
		--sui-background-color-2-hsl: 44 87% 94% !important;
		--sui-background-color-3-hsl: 46 42% 89% !important;
		--sui-background-color-4-hsl: 46 42% 85% !important;
		--sui-background-color-5-hsl: 45 30% 78% !important;
		--sui-border-color-1-hsl: 45 20% 55% !important;
		--sui-border-color-2-hsl: 45 25% 68% !important;
		--sui-border-color-3-hsl: 45 30% 76% !important;
		--sui-primary-accent-color-text: hsl(0 65% 35%) !important;
		--sui-primary-accent-color-light: hsl(0 65% 42%) !important;
		--sui-primary-accent-color: hsl(0 65% 35%) !important;
		--sui-primary-accent-color-dark: hsl(0 65% 28%) !important;
		--sui-primary-accent-color-translucent: hsl(0 65% 45% / 60%) !important;
		--sui-primary-accent-color-translucent-light: hsl(0 65% 45% / 40%) !important;
	}
}
/* поля внутри объекта (у песни — «Параметры») — в ряд, на узком экране переносятся */
[id^="object-"][id$="-item-list"]:has(> section.field) {
	display: flex;
	flex-wrap: wrap;
	gap: 12px;
	padding: 12px;
}
/* каждое поле — карточка: рамка и фон чуть темнее; разделители между полями (линии снизу) не нужны */
[id^="object-"][id$="-item-list"] > section.field {
	flex: 1 1 220px;
	margin: 0 !important;
	padding: 8px 12px 12px !important;
	border: 1px solid hsl(var(--sui-border-color-2-hsl));
	border-radius: 6px;
	background: hsl(var(--sui-background-color-3-hsl));
}
[id^="object-"][id$="-item-list"] > section.field::after { content: none !important; }
/* окно подтверждения сохранения (скрипт ниже) — под кнопкой «Сохранить», в цветах темы Sveltia */
#save-confirm {
	position: fixed; z-index: 2000;
	padding: 10px 14px; border-radius: 6px;
	background: hsl(var(--sui-background-color-1-hsl, 0 0% 100%));
	color: hsl(var(--sui-foreground-color-1-hsl, 0 0% 5%));
	border: 1px solid hsl(var(--sui-border-color-2-hsl, 0 0% 72%));
	box-shadow: 0 4px 16px rgb(0 0 0 / 20%);
	font-size: 14px;
}
#save-confirm p { margin: 0 0 8px; }
#save-confirm div { display: flex; gap: 8px; justify-content: flex-end; }
#save-confirm button {
	padding: 4px 12px; border-radius: 4px; cursor: pointer; font: inherit;
	border: 1px solid hsl(var(--sui-border-color-1-hsl, 0 0% 60%));
	background: transparent; color: inherit;
}
#save-confirm button[data-ok] {
	background: var(--sui-primary-accent-color, #2a6ac8); border-color: transparent;
	color: var(--sui-primary-accent-color-inverted, #fff);
}
#caret-pos {
	position: fixed; right: 16px; bottom: 16px; z-index: 1000;
	padding: 4px 10px; border-radius: 4px;
	background: #333; color: #fff; font: 13px/1.4 "PT Mono", monospace;
	pointer-events: none;
}
</style>
</head>
<body>
<!-- Этот скрипт — до Sveltia: её настройки читаются при запуске, а обработчики клавиш, добавленные раньше, срабатывают
     раньше её собственных (Escape в окне подтверждения не должен закрывать редактор) -->
<script>
// 1. После сохранения оставаться в редакторе. Это настройка Sveltia «Закрывать редактор после сохранения черновика»
//    (по умолчанию включена); ставим «не закрывать», только если человек её ещё не трогал, — в его браузере, в
//    localStorage, где Sveltia её и хранит (ключ sveltia-cms.prefs). Поменять можно в настройках редактора.
try {
	const KEY = 'sveltia-cms.prefs';
	const prefs = JSON.parse(localStorage.getItem(KEY) || '{}') || {};
	if (prefs.closeOnSave === undefined) {
		prefs.closeOnSave = false;
		localStorage.setItem(KEY, JSON.stringify(prefs));
	}
} catch (e) { /* без localStorage — как решит Sveltia */ }

// 2. Подтверждение сохранения у кнопки «Сохранить». Только для щелчка мышью (и Enter/пробела на самой кнопке):
//    Ctrl+S (Cmd+S) Sveltia обрабатывает так, что «нажимает» ту же кнопку программно — у такого щелчка
//    event.isTrusted = false, и он проходит без вопроса. Кнопку узнаём по подписи на панели редактора.
(() => {
	const SAVE_LABELS = ['Сохранить', 'Save'];
	let pop = null;

	const close = () => { if (pop) { pop.remove(); pop = null; } };

	const open = (btn) => {
		close();
		pop = document.createElement('div');
		pop.id = 'save-confirm';
		pop.setAttribute('role', 'dialog');
		pop.setAttribute('aria-label', 'Подтверждение сохранения');
		pop.innerHTML = '<p>Сохранить изменения?</p>'
			+ '<div><button type="button" data-ok>Сохранить</button> <button type="button" data-cancel>Отмена</button></div>';
		document.body.append(pop);
		// под кнопкой, правым краем по её правому краю
		const r = btn.getBoundingClientRect();
		pop.style.top = (r.bottom + 6) + 'px';
		pop.style.right = Math.max(8, document.documentElement.clientWidth - r.right) + 'px';
		pop.querySelector('[data-ok]').addEventListener('click', () => { close(); btn.click(); });
		pop.querySelector('[data-cancel]').addEventListener('click', () => { close(); btn.focus(); });
		pop.querySelector('[data-ok]').focus();
	};

	document.addEventListener('click', (e) => {
		if (pop && !pop.contains(e.target)) close();
		if (!e.isTrusted) return;                          // Ctrl+S и наш собственный повторный щелчок
		const btn = e.target.closest && e.target.closest('button');
		if (!btn || btn.disabled || !btn.closest('[role="toolbar"]')) return;
		if (!SAVE_LABELS.includes(btn.textContent.trim())) return;
		e.preventDefault();
		e.stopImmediatePropagation();
		open(btn);
	}, true);

	// Escape — отмена, Enter — подтверждение; перехватываем раньше Sveltia (Escape у неё закрывает редактор)
	addEventListener('keydown', (e) => {
		if (!pop) return;
		if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); pop.querySelector('[data-cancel]').click(); }
		else if (e.key === 'Enter' && pop.contains(document.activeElement)) { e.preventDefault(); e.stopImmediatePropagation(); document.activeElement.click(); }
	}, true);
	addEventListener('resize', close);
	addEventListener('hashchange', close);
})();
</script>
<!-- Sveltia CMS: правка текстов в репозитории через GitHub API; настройки — config.yml рядом -->
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
<script>
// Предпросмотр песен и переводов — как режим «исходник» на странице песни: текст в <pre> без своего шрифта,
// то есть стандартным моноширинным шрифтом браузера (font-family: monospace — как у <pre> на сайте; в поле
// ввода стоит PT Mono, см. <style>). Параметры песни (тональность и т. п.) в предпросмотре не показываются.
(() => {
	const SongSource = createClass({
		render() {
			return h('pre', { className: 'song-source' }, this.props.entry.getIn(['data', 'body']) || '');
		},
	});
	for (const name of ['texts', 'tr-en', 'tr-de', 'tr-eo', 'tr-he', 'tr-uk', 'tr-fr']) {
		CMS.registerPreviewTemplate(name, SongSource);
	}
	CMS.registerPreviewStyle(
		'pre.song-source { font-family: monospace; white-space: pre; margin: 0; padding: 1em 0; unicode-bidi: plaintext; }',
		{ raw: true },
	);
})();
</script>
<script>
// Строка и символ под курсором в поле текста, оба с 1 — те же числа, что в параметрах песни:
// «Аккорды с позиции» (chordsStartAt) — номер символа, «Последняя строка текста» (textFinishAtLine) — номер строки
(() => {
	// элемент создаётся при первом обращении: Sveltia при запуске может перерисовать <body>
	const getBox = () => {
		let b = document.getElementById('caret-pos');
		if (!b) {
			b = document.createElement('div');
			b.id = 'caret-pos';
			b.hidden = true;
			document.body.append(b);
		}
		return b;
	};
	const update = () => {
		const box = getBox();
		const el = document.activeElement;
		if (!(el instanceof HTMLTextAreaElement)) { box.hidden = true; return; }
		const before = el.value.slice(0, el.selectionStart);
		const line = before.split('\n').length;
		const col = before.length - before.lastIndexOf('\n');
		const total = el.value.split('\n').length;
		box.textContent = `строка ${line} из ${total}, символ ${col}`;
		box.hidden = false;
	};
	for (const ev of ['selectionchange', 'input', 'keyup', 'click', 'focusin', 'focusout']) {
		document.addEventListener(ev, () => setTimeout(update), true);
	}
})();
// Имя открытой коллекции — в атрибут <html data-collection>, для стилей поля текста (см. <style>)
(() => {
	const mark = () => {
		const m = location.hash.match(/^#\/collections\/([^/?]+)/);
		document.documentElement.dataset.collection = m ? m[1] : '';
	};
	mark();
	// Sveltia может менять адрес через history.pushState, без события hashchange, — поэтому ещё и проверка по таймеру
	addEventListener('hashchange', mark);
	addEventListener('popstate', mark);
	setInterval(mark, 500);
})();
</script>
</body>
</html>
