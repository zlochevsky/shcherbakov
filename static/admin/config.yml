# Sveltia CMS (https://sveltiacms.app): редактор файлов content/ прямо в репозитории; открывается по /admin/.
# Каждое сохранение — коммит в master через GitHub API, сайт пересобирает обычный CI.
# Правятся только тексты, которые лежат в git; данные из Directus (названия, годы, альбомы, переводчики) — в Directus.
# Новые записи не создаются и не удаляются: имя файла = id в Directus.
# Ключи заголовка (front matter), не описанные здесь, Sveltia сохраняет как были.

backend:
  name: github
  repo: zlochevsky/shcherbakov
  branch: master
  # вход «Sign in with GitHub»: OAuth-посредник sveltia-cms-auth на Cloudflare Workers (OAuth App
  # «Shcherbakov-sveltia-cms-auth» в настройках GitHub владельца); public_repo вместо repo по умолчанию —
  # без доступа к приватным репозиториям. Вход по токену остаётся
  base_url: https://sveltia-cms-auth.sergey-897.workers.dev
  auth_scope: public_repo
  commit_messages:
    update: "CMS: {{collection}} {{slug}}"
    uploadMedia: "CMS: upload {{path}}"
    deleteMedia: "CMS: delete {{path}}"

media_folder: static/Images
public_folder: /Images

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 4

# Тело — простой текст: пробелы, отступы и аккорды сохраняются как есть (не Markdown-редактор)
collections:
  - name: texts
    label: Тексты песен
    label_singular: Песня
    folder: content/texts
    path: "{{year}}/{{slug}}"
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    summary: "{{dirname}} · {{filename}}"
    fields:
      - label: Параметры
        name: params
        widget: object
        # обязательный — без галочки «Добавить Параметры», снятие которой стёрло бы весь params (и ключи,
        # которых здесь нет, например editionOf); поля внутри — необязательные
        collapsed: true
        fields:
          - { label: Тональность, name: tonality, widget: string, required: false }
          - { label: Аккорды с позиции (номер символа в строке), name: chordsStartAt, widget: number, value_type: int, required: false }
          - { label: Последняя строка текста, name: textFinishAtLine, widget: number, value_type: int, required: false }
      - { label: Текст, name: body, widget: text }

  # Переводы: content/<язык>/<id>.md; страницы языка (у них есть layout) — в коллекции «Страницы языков»
  - name: tr-en
    label: Переводы — English
    folder: content/en
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    filter: { field: layout, value: null }
    summary: "{{filename}}"
    fields: &trfields
      # только для фильтра: у страниц языка layout есть, у переводов нет (пустое не записывается)
      - { label: layout, name: layout, widget: hidden, required: false }
      - { label: Текст, name: body, widget: text }
  - name: tr-de
    label: Переводы — Deutsch
    folder: content/de
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    filter: { field: layout, value: null }
    summary: "{{filename}}"
    fields: *trfields
  - name: tr-eo
    label: Переводы — Esperanto
    folder: content/eo
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    filter: { field: layout, value: null }
    summary: "{{filename}}"
    fields: *trfields
  - name: tr-he
    label: Переводы — עברית
    folder: content/he
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    filter: { field: layout, value: null }
    summary: "{{filename}}"
    fields: *trfields
  - name: tr-uk
    label: Переводы — Українська
    folder: content/uk
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    filter: { field: layout, value: null }
    summary: "{{filename}}"
    fields: *trfields
  - name: tr-fr
    label: Переводы — Français
    folder: content/fr
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    filter: { field: layout, value: null }
    summary: "{{filename}}"
    fields: *trfields

  # Отдельные страницы сайта: тело — Markdown (у tab — HTML), правится как есть, простым полем; анонсы на странице
  # новостей — из Directus (announces), в файле news.md только «Хроника»
  - name: pages
    label: Страницы сайта
    format: json-frontmatter
    files:
      # главная: тело — HTML-вёрстка блоками (abstract, frontimage, collections) и шорткод {{< lastmod … >}} — править
      # осторожно, незакрытый тег ломает вид главной; подвал (_footer.md, на главной и страницах шаблона baseof) —
      # только текст: заголовка у него нет (обязательное поле «Заголовок» не дало бы сохранить)
      - { name: home, label: Главная страница, file: content/_index.md, fields: &sitepagefields [ { label: Заголовок, name: title, widget: string }, { label: Текст, name: body, widget: text } ] }
      - { name: footer, label: Подвал главной, file: content/_footer.md, fields: [ { label: Текст, name: body, widget: text } ] }
      - { name: bio, label: Биография, file: content/bio.md, fields: *sitepagefields }
      - { name: about, label: Об этой коллекции, file: content/about.md, fields: *sitepagefields }
      - { name: buy, label: Где купить, file: content/buy.md, fields: *sitepagefields }
      - { name: news, label: Новости (хроника), file: content/news.md, fields: *sitepagefields }
      - { name: "no", label: Чего не хватает, file: content/no.md, fields: *sitepagefields }
      - { name: tab, label: Что такое таблатуры, file: content/tab.md, fields: *sitepagefields }
      - { name: praises-list, label: Список рецензий (Praises), file: content/praises.md, fields: *sitepagefields }

  # Статьи фан-клуба (шаблон praises-article): тело — HTML. Заголовки файлов приведены к виду, в котором их пишет
  # Sveltia (порядок ключей, отступ 4), чтобы сохранение не давало лишнего diff; поля и их порядок здесь менять
  # вместе с этим видом (scripts/sveltia-normalize.py praises parodies fans).
  # Создавать статьи можно: имя файла (латиницей) вводится вручную, адрес страницы — <раздел>/<имя>.html (uglyURLs,
  # url в заголовке не нужен); type и layout — скрытые поля со значениями по умолчанию (layout ещё и для фильтра:
  # в fans есть kom.md и переадресация kom2.md с другими шаблонами). Ссылку на новую статью вписать в список раздела:
  # рецензии — «Страницы сайта» → «Список рецензий», пародии и фан-клуб — их оглавления (parodies-index, fans-index).
  # Удалять нельзя: на статьи ведут ссылки из списков и других статей — удалять через git, проверив check-links.
  - name: praises
    label: Рецензии (Praises)
    label_singular: Статья
    folder: content/Praises
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: true }
    filter: { field: layout, value: praises-article }
    summary: "{{title}} · {{filename}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Автор, name: author, widget: string, required: false }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
      - &layoutfield { label: layout, name: layout, widget: hidden, required: false, default: praises-article }
      - &typefield { label: type, name: type, widget: hidden, required: false, default: miscellaneous }
      - &articlebody { label: Текст (HTML), name: body, widget: text }
  - name: parodies
    label: Пародии (Parodies)
    label_singular: Пародия
    folder: content/Parodies
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: true }
    filter: { field: layout, value: praises-article }
    summary: "{{title}} · {{filename}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Автор, name: author, widget: string, required: false }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - { label: Ссылка «назад» — адрес, name: backUrl, widget: string, required: false, default: Parodies/index.html }
          - { label: Ссылка «назад» — подпись, name: backTitle, widget: string, required: false, default: Пародии }
      - *layoutfield
      - *typefield
      - *articlebody
  - name: fans
    label: Фан-клуб (fans)
    label_singular: Материал
    folder: content/fans
    nested: { depth: 2, subfolders: false }
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: true }
    filter: { field: layout, value: praises-article }
    summary: "{{title}} · {{filename}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Автор, name: author, widget: string, required: false }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - { label: Ссылка «назад» — адрес, name: backUrl, widget: string, required: false, default: fans/index.html }
          - { label: Ссылка «назад» — подпись, name: backTitle, widget: string, required: false, default: Фан-клуб }
      - *layoutfield
      - *typefield
      - *articlebody

  # Страницы языков: тело — HTML; меню, подписи и прочие настройки заголовка правятся в файле
  - name: language-pages
    label: Страницы языков
    format: json-frontmatter
    files:
      - { name: en-index, label: English — главная, file: content/en/en-index.md, fields: &pagefields [ { label: Заголовок, name: title, widget: string }, { label: Текст (HTML), name: body, widget: text } ] }
      - { name: en-translations, label: English — список переводов, file: content/en/en-translations.md, fields: *pagefields }
      - { name: de-index, label: Deutsch — главная, file: content/de/de-index.md, fields: *pagefields }
      - { name: de-translations, label: Deutsch — список переводов, file: content/de/de-translations.md, fields: *pagefields }
      - { name: uk-index, label: Українська — главная, file: content/uk/uk-index.md, fields: *pagefields }
      - { name: uk-translations, label: Українська — список переводов, file: content/uk/uk-translations.md, fields: *pagefields }
      - { name: fr-index, label: Français — главная, file: content/fr/fr-index.md, fields: *pagefields }
      - { name: fr-translations, label: Français — список переводов, file: content/fr/fr-translations.md, fields: *pagefields }
      - { name: fr-ostromoukhov, label: Français — мемуар Б. Остромуховой, file: content/fr/ostromoukhov-2000.md, fields: *pagefields }
      - { name: eo-index, label: Esperanto — настройки (страница ещё не выводится), file: content/eo/eo-index.md, fields: *pagefields }
      - { name: he-index, label: עברית — настройки (страница ещё не выводится), file: content/he/he-index.md, fields: *pagefields }
