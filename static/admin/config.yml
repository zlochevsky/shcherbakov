# Sveltia CMS (https://sveltiacms.app): редактор файлов content/ прямо в репозитории; открывается по /admin/.
# Каждое сохранение — коммит в master через GitHub API, сайт пересобирает обычный CI.
# Правятся только тексты, которые лежат в git; данные из Directus (названия, годы, альбомы, переводчики) — в Directus.
# Новые записи не создаются и не удаляются: имя файла = id в Directus.
# Ключи заголовка (front matter), не описанные здесь, Sveltia сохраняет как были.

backend:
  name: github
  repo: zlochevsky/shcherbakov
  branch: master
  # вход «Sign in with GitHub»: OAuth-посредник sveltia-cms-auth на Cloudflare Workers (OAuth App
  # «Shcherbakov-sveltia-cms-auth» в настройках GitHub владельца); public_repo вместо repo по умолчанию —
  # без доступа к приватным репозиториям. Вход по токену остаётся
  base_url: https://sveltia-cms-auth.sergey-897.workers.dev
  auth_scope: public_repo
  commit_messages:
    update: "CMS: {{collection}} {{slug}}"
    uploadMedia: "CMS: upload {{path}}"
    deleteMedia: "CMS: delete {{path}}"

media_folder: static/Images
public_folder: /Images

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 4

# Тело — простой текст: пробелы, отступы и аккорды сохраняются как есть (не Markdown-редактор)
# Кнопка «открыть на сайте» в редакторе: preview_path — адрес страницы от корня домена, который Sveltia берёт из
# адреса самой админки (localhost:1313 или zlochevsky.github.io), поэтому с префиксом shcherbakov/ — подпапкой сайта
# на GitHub Pages (и у hugo server). Переедет сайт в корень домена — префикс убрать. Статьи — по своему url;
# у новой статьи без url кнопки нет.
collections:
  - name: texts
    label: Тексты песен
    label_singular: Песня
    folder: content/texts
    path: "{{year}}/{{slug}}"
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    slug: { editable: false }   # имя файла = id записи в Directus: не переименовывать
    summary: "{{dirname}} · {{filename}}"
    preview_path: "shcherbakov/texts/{{dirname}}/{{filename}}.html"
    fields:
      - label: Параметры
        name: params
        widget: object
        # обязательный — без галочки «Добавить Параметры», снятие которой стёрло бы весь params (и ключи,
        # которых здесь нет, например editionOf); поля внутри — необязательные
        collapsed: true
        fields:
          - { label: Тональность, name: tonality, widget: string, required: false }
          - { label: Аккорды с позиции (номер символа в строке), name: chordsStartAt, widget: number, value_type: int, required: false }
          - { label: Последняя строка текста, name: textFinishAtLine, widget: number, value_type: int, required: false }
      - { label: Текст, name: body, widget: text }


  - divider: true

  # Поля для поисковиков (layouts/partials/seo.html, docs/frontmatter.ru.md) объявлены якорями &seotitle и &seodesc в полях
  # главной страницы ниже и переиспользуются в других коллекциях. Оба необязательные: пусто — заголовок и описание
  # собирает шаблон. seoTitle — внутри params, description — стандартное поле Hugo.
  # Отдельные страницы сайта: тело — Markdown (у tab — HTML), правится как есть, простым полем; анонсы на странице
  # новостей — из Directus (announces), в файле news.md только «Хроника»
  - name: pages
    label: Страницы сайта
    format: json-frontmatter
    files:
      # главная: тело — HTML-вёрстка блоками (abstract, frontimage, collections) и шорткод {{< lastmod … >}} — править
      # осторожно, незакрытый тег ломает вид главной; подвал (_footer.md, на главной и страницах шаблона baseof) —
      # только текст: заголовка у него нет (обязательное поле «Заголовок» не дало бы сохранить)
      - { name: home, preview_path: "shcherbakov/index.html", label: Главная страница, file: content/_index.md, fields: &sitepagefields [ { label: Заголовок, name: title, widget: string }, { label: Параметры, name: params, widget: object, collapsed: true, fields: [ &seotitle { label: Заголовок для поисковиков, name: seoTitle, widget: string, required: false, hint: "Полный текст вкладки браузера и заголовка в выдаче, как есть. Пусто — заголовок страницы с припиской раздела («— Михаил Щербаков»)" } ] }, &seodesc { label: Описание для поисковиков, name: description, widget: text, required: false, hint: "Одна-две фразы, 110–160 знаков: текст под ссылкой в выдаче и в превью ссылок в мессенджерах. Пусто — у статей начало текста, у остальных страниц ничего" }, { label: Текст, name: body, widget: text } ] }
      - { name: footer, preview_path: "shcherbakov/index.html", label: Подвал главной, file: content/_footer.md, fields: [ { label: Текст, name: body, widget: text } ] }
      - { name: bio, preview_path: "shcherbakov/bio.html", label: Биография, file: content/bio.md, fields: *sitepagefields }
      - { name: about, preview_path: "shcherbakov/about.html", label: Об этой коллекции, file: content/about.md, fields: *sitepagefields }
      - { name: buy, preview_path: "shcherbakov/buy.html", label: Где купить, file: content/buy.md, fields: *sitepagefields }
      - { name: news, preview_path: "shcherbakov/news.html", label: Новости (хроника), file: content/news.md, fields: *sitepagefields }
      - { name: "no", preview_path: "shcherbakov/no.html", label: Чего не хватает, file: content/no.md, fields: *sitepagefields }
      - { name: tab, preview_path: "shcherbakov/tab.html", label: Что такое таблатуры, file: content/tab.md, fields: *sitepagefields }
      - { name: praises-list, preview_path: "shcherbakov/praises.html", label: Список рецензий (Praises), file: content/praises.md, fields: *sitepagefields }
      # страницы, содержимое которых строит шаблон из Directus: в файле — заголовок, поля для поисковиков и вступление
      - { name: catalogue, preview_path: "shcherbakov/catalogue.html", label: Каталог песен, file: content/catalogue.md, fields: *sitepagefields }
      - { name: translations, preview_path: "shcherbakov/translations.html", label: Каталог переводов, file: content/translations.md, fields: *sitepagefields }
      - { name: concerts, preview_path: "shcherbakov/concerts.html", label: Концерты, file: content/concerts.md, fields: *sitepagefields }
      - { name: search, preview_path: "shcherbakov/search.html", label: Поиск, file: content/search.md, fields: *sitepagefields }
      # «Лог»: записи — из Directus (log_entries), в файле — прежняя хроника (HTML, ~130 КБ)
      - { name: log, preview_path: "shcherbakov/log.html", label: Лог, file: content/log.md, fields: *sitepagefields }
      - { name: statistics, preview_path: "shcherbakov/statistics.html", label: Статистика, file: content/statistics.md, fields: *sitepagefields }
      # «Другие публикации» сами не выводятся: их текст вставляется в страницу «Книги»
      - { name: other-publications, preview_path: "shcherbakov/Books/index.html", label: Книги — другие публикации, file: content/Books/other-publications.md, fields: *sitepagefields }
      # страница со ссылками на таблицы Directus (блок «Таблицы Directus» в левой панели берёт список отсюда — скрипт в index.html):
      # группа с заголовком выводится списком а), б), в)…, без заголовка — таблицы одной строкой через «и»
      - name: admin-directus
        preview_path: "shcherbakov/admin/directus.html"
        label: Таблицы Directus (ссылки для редакторов)
        file: content/admin-directus.md
        fields:
          - { label: Заголовок, name: title, widget: string }
          - label: Параметры
            name: params
            widget: object
            fields:
              - label: Группы
                name: groups
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Заголовок группы, name: title, widget: string, required: false, hint: "Пусто — таблицы группы выводятся одной строкой через «и»" }
                  - label: Таблицы
                    name: tables
                    widget: list
                    summary: "{{fields.label}} ({{fields.table}})"
                    fields:
                      - { label: Название, name: label, widget: string }
                      - { label: Таблица в Directus, name: table, widget: string, hint: "Имя коллекции, как в адресе Directus: events, works…" }
                      - { label: Описание, name: description, widget: text, required: false }
          - { label: Текст над списком, name: body, widget: text }


  - divider: true

  # Статьи (шаблон praises-article): тело — HTML. Заголовки файлов приведены к виду, в котором их пишет
  # Sveltia (порядок ключей, отступ 4), чтобы сохранение не давало лишнего diff; поля и их порядок здесь менять
  # вместе с этим видом (scripts/sveltia-normalize.py praises club releases images pages language-pages).
  # Рецензии создавать можно: имя файла (латиницей) вводится вручную, адрес страницы — Praises/<имя>.html (uglyURLs,
  # url в заголовке не нужен); type и layout — скрытые поля со значениями по умолчанию (layout ещё и для фильтра).
  # Ссылку на новую статью вписать в список раздела: рецензии — «Страницы сайта» → «Список рецензий», статьи
  # фан-клуба — оглавление своего раздела (fans-index, parodies-index, fom-index, sch2-index).
  # Удалять нельзя: на статьи ведут ссылки из списков и других статей — удалять через git, проверив check-links.
  - name: praises
    label: Рецензии (Praises)
    label_singular: Статья
    folder: content/Praises
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: [create] }   # имя файла вводится только при создании; адрес статьи — её url
    filter: { field: layout, value: praises-article }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Автор, name: author, widget: string, required: false }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - *seotitle
      - *seodesc
      - &layoutfield { label: layout, name: layout, widget: hidden, required: false, default: praises-article }
      - &typefield { label: type, name: type, widget: hidden, required: false, default: miscellaneous }
      # тело — поле Markdown только в режиме исходника (modes: raw): правится тот же HTML как текст, без визуального
      # редактора, который переписал бы разметку; зато предпросмотр его отрисовывает (Markdown с сырым HTML, как Hugo
      # на сайте; скрипты и iframe Sveltia в предпросмотре вырезает). Картинки и ссылки видны: базой адресов предпросмотра
      # скрипт в index.html ставит папку Images сайта; не видны только адреса «../../» из подпапок фан-клуба
      - &articlebody { label: Текст (HTML), name: body, widget: markdown, modes: [raw] }

  # Статьи фан-клуба — одна коллекция на несколько папок: content/ с вложенными папками (nested, два уровня), записи
  # отбираются по url (фильтр в Sveltia — одно условие): fans, Parodies, FOM («Щ-1»), SCH2 («Щ-2»), sociology,
  # kniga_pamyati. В левой панели — дерево папок. Переадресации лежат глубже двух уровней (content/redirects/legacy/)
  # и сюда не попадают; fans/kom2 (переадресация) — без url. «Отзывы» — отдельной коллекцией выше.
  # Новая статья: «Parent Folder» — папка раздела (подставляется открытая в списке), «Адрес» — тот же раздел
  # и латинское имя: /fans/imya.html. Без url статья не попала бы в список (по нему фильтр), поэтому он обязателен.
  # Ссылка «назад» по умолчанию — оглавление раздела (layouts/miscellaneous/praises-article.html).
  - name: club
    label: Статьи фан-клуба
    label_singular: Статья
    folder: content
    nested: { depth: 2, subfolders: false }
    meta: { path: { label: Раздел (папка) } }
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: [create] }   # имя файла вводится только при создании
    filter: { field: url, pattern: '^/(fans|Parodies|FOM|SCH2)/|^/(sociology|kniga_pamyati)\.html$' }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Адрес, name: url, widget: string, pattern: ['^/(fans|Parodies|FOM|SCH2)/[A-Za-z0-9_.-]+\.html$|^/(sociology|kniga_pamyati)\.html$', 'Адрес вида /fans/imya.html — раздел тот же, что у папки, имя латиницей'], hint: "Раздел — тот же, что у папки: /fans/…, /Parodies/…, /FOM/…, /SCH2/…; имя латиницей, с .html" }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Автор, name: author, widget: string, required: false }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - { label: Ссылка «назад» — адрес, name: backUrl, widget: string, required: false, hint: "Пункт угловой навигации — родительская страница. Путь от корня сайта без начальной «/», напр. fans/index.html. Пусто — оглавление раздела" }
          - { label: Ссылка «назад» — подпись, name: backTitle, widget: string, required: false }
          - *seotitle
      - *seodesc
      - *layoutfield
      - *typefield
      - *articlebody

  # Диски, кассеты, книги, циклы, архив гастролей: данные (треки, обложки, выходные данные) — из Directus по params.id,
  # в файле — заголовок, поля для поисковиков и текст. Параметры (id и прочее) в форме не показываются и сохраняются
  # как есть. Новые страницы появляются вместе с записями в Directus. Отбор — по url, как у статей фан-клуба.
  - name: releases
    label: Диски, книги, архив
    label_singular: Страница
    folder: content
    nested: { depth: 2, subfolders: false }
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    slug: { editable: false }
    filter: { field: url, pattern: '^/(Disks|Tapes|Books|Cycles|Archive)/' }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: url, name: url, widget: hidden, required: false }
      - { label: Параметры, name: params, widget: object, collapsed: true, fields: [ { label: Подзаголовок, name: subtitle, widget: string, required: false }, *seotitle ] }
      - *seodesc
      - { label: Текст, name: body, widget: text, required: false }

  # Страницы картинок (шаблон images-page): тело — HTML; картинки лежат в static/Images, на страницах на них ссылаются
  # просто по имени файла ("afish1.jpg"). Кнопка вставки картинки пишет адрес от корня домена
  # (/Images/…), который на github.io (сайт в подпапке /shcherbakov/) не открывается — вписывать имя файла вручную.
  # Переадресации со старых адресов (content/Images/redirects) в коллекцию не входят: вложенные папки не читаются,
  # и у них другой шаблон. Создание и удаление — как у статей.
  - name: images
    label: Картинки (Images)
    label_singular: Страница
    folder: content/Images
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: [create] }   # имя файла вводится только при создании; адрес страницы — её url
    filter: { field: layout, value: images-page }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - { label: Ссылка «назад» — адрес, name: parentUrl, widget: string, required: false, default: Images/index.html }
          - { label: Ссылка «назад» — подпись, name: parentTitle, widget: string, required: false, default: Картинки }
          - { label: Цвет фона, name: bgColor, widget: string, required: false, hint: "CSS-цвет, напр. #DDC5A4; пусто — цвет по умолчанию (khaki)" }
          - { label: Текст по центру, name: centerText, widget: boolean, required: false }
          - *seotitle
      - *seodesc
      - { label: layout, name: layout, widget: hidden, required: false, default: images-page }
      - *typefield
      - *articlebody

  # Языковая группа (страницы языков и переводы) отбита в левой панели разделителем (вложенных разделов в Sveltia нет)
  - divider: true


  # Страницы языков: тело — HTML; меню, подписи и прочие настройки заголовка правятся в файле
  - name: language-pages
    label: Страницы языков
    format: json-frontmatter
    files:
      - { name: en-index, preview_path: "shcherbakov/en/index.html", label: English — главная, file: content/en/en-index.md, fields: &pagefields [ { label: Заголовок, name: title, widget: string }, { label: Параметры, name: params, widget: object, collapsed: true, fields: [ *seotitle ] }, *seodesc, { label: Текст (HTML), name: body, widget: text } ] }
      - { name: en-translations, preview_path: "shcherbakov/en/translations.html", label: English — список переводов, file: content/en/en-translations.md, fields: *pagefields }
      - { name: de-index, preview_path: "shcherbakov/de/index.html", label: Deutsch — главная, file: content/de/de-index.md, fields: *pagefields }
      - { name: de-translations, preview_path: "shcherbakov/de/translations.html", label: Deutsch — список переводов, file: content/de/de-translations.md, fields: *pagefields }
      - { name: uk-index, preview_path: "shcherbakov/uk/index.html", label: Українська — главная, file: content/uk/uk-index.md, fields: *pagefields }
      - { name: uk-translations, preview_path: "shcherbakov/uk/translations.html", label: Українська — список переводов, file: content/uk/uk-translations.md, fields: *pagefields }
      - { name: fr-index, preview_path: "shcherbakov/fr/index.html", label: Français — главная, file: content/fr/fr-index.md, fields: *pagefields }
      - { name: fr-translations, preview_path: "shcherbakov/fr/translations.html", label: Français — список переводов, file: content/fr/fr-translations.md, fields: *pagefields }
      - { name: fr-ostromoukhov, preview_path: "shcherbakov/fr/ostromoukhov-2000.html", label: Français — мемуар Б. Остромуховой, file: content/fr/ostromoukhov-2000.md, fields: *pagefields }
      - { name: eo-index, preview_path: "shcherbakov/eo/index.html", label: Esperanto — главная, file: content/eo/eo-index.md, fields: *pagefields }
      - { name: eo-translations, preview_path: "shcherbakov/eo/translations.html", label: Esperanto — список переводов, file: content/eo/eo-translations.md, fields: *pagefields }
      - { name: he-index, preview_path: "shcherbakov/he/index.html", label: עברית — главная, file: content/he/he-index.md, fields: *pagefields }
      - { name: he-translations, preview_path: "shcherbakov/he/translations.html", label: עברית — список переводов, file: content/he/he-translations.md, fields: *pagefields }


  # Переводы: content/<язык>/<id>.md — одна коллекция на все языки, в левой панели — папки языков. Отбор — по пустому
  # layout: он есть у страниц языков, у подвала главной и других служебных страниц, у переводов — нет
  - name: translations
    label: Переводы
    label_singular: Перевод
    folder: content
    nested: { depth: 2, subfolders: false }
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    slug: { editable: false }   # имя файла = id записи в Directus: не переименовывать
    filter: { field: layout, value: null }
    summary: "{{filename}}"
    preview_path: "shcherbakov/{{dirname}}/{{filename}}.html"
    fields:
      # только для фильтра (пустое не записывается)
      - { label: layout, name: layout, widget: hidden, required: false }
      - { label: Текст, name: body, widget: text }
