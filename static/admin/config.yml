# Sveltia CMS (https://sveltiacms.app): редактор файлов content/ прямо в репозитории; открывается по /admin/.
# Каждое сохранение — коммит в master через GitHub API, сайт пересобирает обычный CI.
# Правятся только тексты, которые лежат в git; данные из Directus (названия, годы, альбомы, переводчики) — в Directus.
# Новые записи не создаются и не удаляются: имя файла = id в Directus.
# Ключи заголовка (front matter), не описанные здесь, Sveltia сохраняет как были.

backend:
  name: github
  repo: zlochevsky/shcherbakov
  branch: master
  # вход «Sign in with GitHub»: OAuth-посредник sveltia-cms-auth на Cloudflare Workers (OAuth App
  # «Shcherbakov-sveltia-cms-auth» в настройках GitHub владельца); public_repo вместо repo по умолчанию —
  # без доступа к приватным репозиториям. Вход по токену остаётся
  base_url: https://sveltia-cms-auth.sergey-897.workers.dev
  auth_scope: public_repo
  commit_messages:
    update: "CMS: {{collection}} {{slug}}"
    uploadMedia: "CMS: upload {{path}}"
    deleteMedia: "CMS: delete {{path}}"

media_folder: static/Images
public_folder: /Images

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 4

# Тело — простой текст: пробелы, отступы и аккорды сохраняются как есть (не Markdown-редактор)
# Кнопка «открыть на сайте» в редакторе: preview_path — адрес страницы от корня домена, который Sveltia берёт из
# адреса самой админки (localhost:1313 или zlochevsky.github.io), поэтому с префиксом shcherbakov/ — подпапкой сайта
# на GitHub Pages (и у hugo server). Переедет сайт в корень домена — префикс убрать. Статьи — по своему url;
# у новой статьи без url кнопки нет.
collections:
  - name: texts
    label: Тексты песен
    label_singular: Песня
    folder: content/texts
    path: "{{year}}/{{slug}}"
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    slug: { editable: false }   # имя файла = id записи в Directus: не переименовывать
    summary: "{{dirname}} · {{filename}}"
    preview_path: "shcherbakov/texts/{{dirname}}/{{filename}}.html"
    fields:
      - label: Параметры
        name: params
        widget: object
        # обязательный — без галочки «Добавить Параметры», снятие которой стёрло бы весь params (и ключи,
        # которых здесь нет, например editionOf); поля внутри — необязательные
        collapsed: true
        fields:
          - { label: Тональность, name: tonality, widget: string, required: false }
          - { label: Аккорды с позиции (номер символа в строке), name: chordsStartAt, widget: number, value_type: int, required: false }
          - { label: Последняя строка текста, name: textFinishAtLine, widget: number, value_type: int, required: false }
      - { label: Дата публикации, name: lastmod, widget: datetime, time_format: false, required: false, hint: "Когда текст опубликован на сайте; по самой свежей — дата «Каталога песен» в меню. Пусто — даты нет" }
      - { label: Текст, name: body, widget: text }


  - divider: true

  # Поля для поисковиков (layouts/partials/seo.html, docs/frontmatter.ru.md) объявлены якорями &seotitle и &seodesc в полях
  # главной страницы ниже и переиспользуются в других коллекциях. Оба необязательные: пусто — заголовок и описание
  # собирает шаблон. seoTitle — внутри params, description — стандартное поле Hugo.
  # Отдельные страницы сайта: тело — Markdown (у tab — HTML), правится как есть, простым полем; анонсы на странице
  # новостей — из Directus (announces), в файле news.md только «Хроника»
  - name: pages
    label: Корневые уникальные страницы
    format: json-frontmatter
    files:
      # главная: тело — HTML-вёрстка блоками (abstract, frontimage, collections) и шорткод {{< lastmod … >}} — править
      # осторожно, незакрытый тег ломает вид главной; подвал (_footer.md, на главной и страницах шаблона baseof) —
      # только текст: заголовка у него нет (обязательное поле «Заголовок» не дало бы сохранить)
      - { name: home, preview_path: "shcherbakov/index.html", label: Главная страница (_index), file: content/_index.md, fields: &sitepagefields [ { label: Заголовок, name: title, widget: string }, { label: Параметры, name: params, widget: object, collapsed: true, fields: [ &seotitle { label: Заголовок для поисковиков, name: seoTitle, widget: string, required: false, hint: "Полный текст вкладки браузера и заголовка в выдаче, как есть. Пусто — заголовок страницы с припиской раздела («— Михаил Щербаков»)" }, &menudate { label: Показывать дату в меню, name: menuDate, widget: boolean, required: false, hint: "Только у страниц, на которые ведёт пункт меню: дата обновления рядом с пунктом" }, &menudatefrom { label: Откуда дата для меню, name: menuDateFrom, widget: select, required: false, hint: "Пусто — поле «Дата» этой страницы", options: [ { label: "Самая свежая рецензия (Praises)", value: praises }, { label: "Самая свежая статья фан-клуба (fans, пародии, Щ-1, Щ-2)", value: club }, { label: "Самая свежая страница картинок", value: images }, { label: "Самый свежий текст песни", value: texts }, { label: "Самый свежий перевод", value: translations }, { label: "Действующие объявления (Directus)", value: announces } ] } ] }, &seodesc { label: Описание для поисковиков, name: description, widget: text, required: false, hint: "Одна-две фразы, 110–160 знаков: текст под ссылкой в выдаче и в превью ссылок в мессенджерах. Пусто — у статей начало текста, у остальных страниц ничего" }, &datefield { label: Дата, name: lastmod, widget: datetime, time_format: false, required: false, hint: "Дата обновления страницы (не меняется сама при сохранении): по ней — дата в меню и в sitemap. Пусто — даты нет" }, { label: Текст, name: body, widget: markdown, modes: [raw] } ] }
      - { name: footer, preview_path: "shcherbakov/index.html", label: Подвал главной (_footer), file: content/_footer.md, fields: [ { label: Текст, name: body, widget: markdown, modes: [raw] } ] }
      - { name: bio, preview_path: "shcherbakov/bio.html", label: Биография (bio), file: content/bio.md, fields: *sitepagefields }
      - { name: about, preview_path: "shcherbakov/about.html", label: Об этой коллекции (about), file: content/about.md, fields: *sitepagefields }
      - { name: buy, preview_path: "shcherbakov/buy.html", label: Где купить (buy), file: content/buy.md, fields: *sitepagefields }
      - { name: news, preview_path: "shcherbakov/news.html", label: Новости (news), file: content/news.md, fields: *sitepagefields }
      - { name: "no", preview_path: "shcherbakov/no.html", label: Нужно (no), file: content/no.md, fields: *sitepagefields }
      - { name: praises-list, preview_path: "shcherbakov/praises.html", label: Отзывы и критика (praises), file: content/praises.md, fields: *sitepagefields }
      # страницы, содержимое которых целиком строит шаблон (из Directus, у поиска — Pagefind): тело файла на сайт не
      # выводится, поэтому поля «Текст» у них нет — только заголовок, поля для поисковиков, дата и флажки меню
      - { name: catalogue, preview_path: "shcherbakov/catalogue.html", label: Каталог песен (catalogue), file: content/catalogue.md, fields: &templatepagefields [ { label: Заголовок, name: title, widget: string, hint: "Содержимое этой страницы строит шаблон из данных Directus (у поиска — из индекса поиска). Здесь — только заголовок, поля для поисковиков и дата: текста у страницы нет" }, { label: Параметры, name: params, widget: object, collapsed: true, fields: [ *seotitle, *menudate, *menudatefrom ] }, *seodesc, *datefield ] }
      - { name: translations, preview_path: "shcherbakov/translations.html", label: Каталог переводов (translations), file: content/translations.md, fields: *templatepagefields }
      - { name: concerts, preview_path: "shcherbakov/concerts.html", label: Концерты (concerts), file: content/concerts.md, fields: *templatepagefields }
      - { name: search, preview_path: "shcherbakov/search.html", label: Поиск, file: content/search.md, fields: *templatepagefields }
      # «Лог»: записи — из Directus (log_entries), в файле — прежняя хроника (HTML, ~130 КБ)
      - { name: log, preview_path: "shcherbakov/log.html", label: Лог (log), file: content/log.md, fields: *sitepagefields }
      # «Другие публикации» сами не выводятся: их текст вставляется в страницу «Книги»
      - { name: other-publications, preview_path: "shcherbakov/Books/index.html", label: Книги — другие публикации (Books/other-publications), file: content/Books/other-publications.md, fields: *sitepagefields }
      # страница со ссылками на таблицы Directus (блок «Таблицы Directus» в левой панели берёт список отсюда — скрипт в index.html):
      # группа с заголовком выводится списком а), б), в)…, без заголовка — таблицы одной строкой через «и»
      - name: admin-directus
        preview_path: "shcherbakov/admin/directus.html"
        label: Таблицы Directus (ссылки для редакторов)
        file: content/admin-directus.md
        fields:
          - { label: Заголовок, name: title, widget: string }
          - label: Параметры
            name: params
            widget: object
            fields:
              - label: Группы
                name: groups
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Заголовок группы, name: title, widget: string, required: false, hint: "Пусто — таблицы группы выводятся одной строкой через «и»" }
                  - label: Таблицы
                    name: tables
                    widget: list
                    summary: "{{fields.label}} ({{fields.table}})"
                    fields:
                      - { label: Название, name: label, widget: string }
                      - { label: Таблица в Directus, name: table, widget: string, hint: "Имя коллекции, как в адресе Directus: events, works…" }
                      - { label: Описание, name: description, widget: text, required: false }
          - { label: Текст над списком, name: body, widget: markdown, modes: [raw] }

  # Корневые типовые страницы — простые страницы-статьи в корне сайта (шаблон praises-article), вне фан-клуба: «Что такое
  # таблатуры», «Статистика» и новые. Отбор — по url корня (/<имя>.html), кроме страниц фан-клуба в корне
  # (kniga_pamyati, sociology) и каталога переводов. Новая страница: «Адрес» — /imya.html (латиницей).
  # Ссылка «назад» по умолчанию — на главную (вверху она не выводится: там всегда есть «На главную страницу»).
  - name: showcase
    label: Корневые типовые страницы
    label_singular: Корневая типовая страница
    folder: content
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: [create] }
    filter: { field: url, pattern: '^/(?!(kniga_pamyati|sociology|translations)\.html$)[A-Za-z0-9_-]+\.html$' }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Адрес, name: url, widget: string, pattern: ['^/[A-Za-z0-9_-]+\.html$', 'Адрес вида /imya.html, латиницей'] }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Автор, name: author, widget: string, required: false }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - { label: Ссылка «назад» — адрес, name: backUrl, widget: string, required: false, hint: "Пункт угловой навигации — родительская страница. Путь от корня сайта без начальной «/», напр. about.html. Пусто — на главную страницу" }
          - { label: Ссылка «назад» — подпись, name: backTitle, widget: string, required: false }
          - { label: Моноширинный <pre>, name: monoPre, widget: boolean, required: false, hint: "Для текста, выровненного пробелами (таблицы, табулатуры)" }
          - *seotitle
          - *menudate
          - *menudatefrom
      - *seodesc
      - { label: Дата, name: lastmod, widget: datetime, time_format: false, required: false, hint: "Дата публикации или обновления — кнопка Today ставит сегодняшнюю; сама при сохранении не меняется. Пусто — даты нет" }
      - { label: layout, name: layout, widget: hidden, required: false, default: praises-article }
      - { label: type, name: type, widget: hidden, required: false, default: miscellaneous }
      - { label: Текст (HTML), name: body, widget: markdown, modes: [raw] }

  # Порядок меню: config/_default/menus.json целиком — шесть меню, пункты перетаскиваются мышью. Hugo сортирует пункты
  # по weight, а не по месту в списке, поэтому при сохранении скрипт в index.html (preSave) проставляет weight по месту:
  # 10, 20, 30… Подпункты (языки, разделы «Фан-клуба») стоят в списке сразу за своим разделом: их порядок — тоже по месту.
  # Все ключи пунктов описаны полями (weight — скрытым), чтобы сохранение их не потеряло.
  - name: menus
    label: Порядок меню
    format: json
    files:
      - name: menus
        label: Меню сайта
        file: config/_default/menus.json
        fields:
          - label: Главная — верхнее меню
            name: indexheadermenu
            widget: list
            label_singular: пункт
            collapsed: true
            summary: &menusummary "{{fields.name}}{{fields.parent | ternary(' — подпункт', '')}}"
            fields: &menuitem
              - { label: Подпись, name: name, widget: string }
              - { label: Страница, name: pageRef, widget: string, required: false, hint: "Файл страницы от папки content: news.html, fans/fans-index.md… Пусто — у раздела с подпунктами" }
              - { label: Код раздела, name: identifier, widget: string, required: false, hint: "Только у пункта с подпунктами (languages, fanclub…): на него ссылаются подпункты" }
              - { label: Входит в раздел, name: parent, widget: string, required: false, hint: "Код раздела, если это подпункт; ставить сразу после раздела" }
              - { label: weight, name: weight, widget: hidden, required: false }
              - label: Оформление
                name: params
                widget: object
                required: false
                collapsed: true
                fields:
                  - { label: Подпись на мобильном, name: shortName, widget: string, required: false }
                  - { label: Только на мобильном, name: mobileOnly, widget: select, required: false, options: [ { label: да, value: "yes" } ] }
                  - { label: Значок, name: icon, widget: select, required: false, options: [ { label: дом, value: home }, { label: лупа, value: search } ] }
                  - { label: Раздел — подпункты отдельными ячейками, name: collapsible, widget: select, required: false, options: [ { label: да, value: "yes" } ] }
                  - { label: Подпункт раздела-ячеек, name: toggleChild, widget: select, required: false, options: [ { label: да, value: "yes" } ] }
                  - { label: Раздел — список внутри ячейки, name: dropdown, widget: select, required: false, options: [ { label: да, value: "yes" } ] }
                  - { label: Язык подписи, name: lang, widget: string, required: false }
                  - { label: Дата у пункта, name: date, widget: select, required: false, hint: "Пусто — как решает страница (флажок «Показывать дату в меню»)", options: [ { label: не показывать, value: hide }, { label: показывать, value: show } ] }
          - { label: Главная — нижнее меню, name: indexfootermenu, widget: list, label_singular: пункт, collapsed: true, summary: *menusummary, fields: *menuitem }
          - { label: Страница поиска, name: searchheadermenu, widget: list, label_singular: пункт, collapsed: true, summary: *menusummary, fields: *menuitem }
          - { label: Каталог песен, name: ctgheadermenu, widget: list, label_singular: пункт, collapsed: true, summary: *menusummary, fields: *menuitem }
          - { label: Каталог переводов, name: trnheadermenu, widget: list, label_singular: пункт, collapsed: true, summary: *menusummary, fields: *menuitem }
          - { label: Концерты, name: concertsheadermenu, widget: list, label_singular: пункт, collapsed: true, summary: *menusummary, fields: *menuitem }


  - divider: true

  # Статьи (шаблон praises-article): тело — HTML. Заголовки файлов приведены к виду, в котором их пишет
  # Sveltia (порядок ключей, отступ 4), чтобы сохранение не давало лишнего diff; поля и их порядок здесь менять
  # вместе с этим видом (scripts/sveltia-normalize.py praises club releases images pages language-pages).
  # Рецензии создавать можно: имя файла (латиницей) вводится вручную, адрес страницы — Praises/<имя>.html (uglyURLs,
  # url в заголовке не нужен); type и layout — скрытые поля со значениями по умолчанию (layout ещё и для фильтра).
  # Ссылку на новую статью вписать в список раздела: рецензии — «Страницы сайта» → «Список рецензий», статьи
  # фан-клуба — оглавление своего раздела (fans-index, parodies-index, fom-index, sch2-index).
  # Удалять нельзя: на статьи ведут ссылки из списков и других статей — удалять через git, проверив check-links.
  - name: praises
    label: отзывы и критика (Praises)
    label_singular: Рецензия
    folder: content/Praises
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: [create] }   # имя файла вводится только при создании; адрес статьи — её url
    filter: { field: layout, value: praises-article }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Автор, name: author, widget: string, required: false }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - *seotitle
      - *seodesc
      - &datefieldnew { label: Дата, name: lastmod, widget: datetime, time_format: false, required: false, hint: "Дата публикации или обновления — кнопка Today ставит сегодняшнюю; сама при сохранении не меняется. По ней — дата раздела в меню. Пусто — даты нет" }
      - &layoutfield { label: layout, name: layout, widget: hidden, required: false, default: praises-article }
      - &typefield { label: type, name: type, widget: hidden, required: false, default: miscellaneous }
      # тело — поле Markdown только в режиме исходника (modes: raw): правится тот же HTML как текст, без визуального
      # редактора, который переписал бы разметку; зато предпросмотр его отрисовывает (Markdown с сырым HTML, как Hugo
      # на сайте; скрипты и iframe Sveltia в предпросмотре вырезает). Картинки и ссылки видны: базой адресов предпросмотра
      # скрипт в index.html ставит папку Images сайта; не видны только адреса «../../» из подпапок фан-клуба
      - &articlebody { label: Текст (HTML), name: body, widget: markdown, modes: [raw] }

  # Статьи фан-клуба — одна коллекция на несколько папок: content/ с вложенными папками (nested, два уровня), записи
  # отбираются по url (фильтр в Sveltia — одно условие): fans, Parodies, FOM («Щ-1»), SCH2 («Щ-2»), sociology,
  # kniga_pamyati. В левой панели — дерево папок. Переадресации лежат глубже двух уровней (content/redirects/legacy/)
  # и сюда не попадают; fans/kom2 (переадресация) — без url. «Отзывы» — отдельной коллекцией выше.
  # Новая статья: «Parent Folder» — папка раздела (подставляется открытая в списке), «Адрес» — тот же раздел
  # и латинское имя: /fans/imya.html. Без url статья не попала бы в список (по нему фильтр), поэтому он обязателен.
  # Ссылка «назад» по умолчанию — оглавление раздела (layouts/miscellaneous/praises-article.html).
  - name: club
    label: Статьи фан-клуба
    label_singular: Статья фан-клуба
    folder: content
    nested: { depth: 2, subfolders: false }
    meta: { path: { label: Раздел (папка) } }
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: [create] }   # имя файла вводится только при создании
    filter: { field: url, pattern: '^/(fans|Parodies|FOM|SCH2)/|^/(sociology|kniga_pamyati)\.html$' }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Адрес, name: url, widget: string, pattern: ['^/(fans|Parodies|FOM|SCH2)/[A-Za-z0-9_.-]+\.html$|^/(sociology|kniga_pamyati)\.html$', 'Адрес вида /fans/imya.html — раздел тот же, что у папки, имя латиницей'], hint: "Раздел — тот же, что у папки: /fans/…, /Parodies/…, /FOM/…, /SCH2/…; имя латиницей, с .html" }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Автор, name: author, widget: string, required: false }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - { label: Ссылка «назад» — адрес, name: backUrl, widget: string, required: false, hint: "Пункт угловой навигации — родительская страница. Путь от корня сайта без начальной «/», напр. fans/index.html. Пусто — оглавление раздела" }
          - { label: Ссылка «назад» — подпись, name: backTitle, widget: string, required: false }
          - *seotitle
          - *menudate
          - *menudatefrom
      - *seodesc
      - *datefieldnew
      - *layoutfield
      - *typefield
      - *articlebody

  # Диски, кассеты, книги, циклы, архив гастролей: данные (треки, обложки, выходные данные) — из Directus по params.id,
  # в файле — заголовок, поля для поисковиков и текст. Отбор — по url, как у статей фан-клуба. Новая страница (кнопка
  # «+» или «New»): «Parent Folder» — папка раздела, «Адрес» — тот же раздел и имя (обычно = id), вид страницы и id записи
  # в Directus (у страниц гастролей id нет). Вид и id у существующих страниц не менять: это связь с шаблоном и базой.
  - name: releases
    label: Диски, книги, архив
    label_singular: Диск, книга, гастроли
    folder: content
    nested: { depth: 2, subfolders: false }
    meta: { path: { label: Раздел (папка) } }
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: [create] }
    filter: { field: url, pattern: '^/(Disks|Tapes|Books|Cycles|Archive)/' }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Адрес, name: url, widget: string, pattern: ['^/(Disks|Tapes|Books|Cycles|Archive)/[A-Za-z0-9_.-]+\.html$', 'Адрес вида /Disks/imya.html — раздел тот же, что у папки'], hint: "Раздел — тот же, что у папки: /Disks/…, /Tapes/…, /Books/…, /Cycles/…, /Archive/…; имя — обычно id записи в Directus" }
      - label: Вид страницы
        name: layout
        widget: select
        default: diskpage
        hint: "Задаётся при создании; у существующих страниц не менять"
        options:
          - { label: Диск, value: diskpage }
          - { label: Кассета, value: tapepage }
          - { label: Книга, value: bookpage }
          - { label: Цикл песен, value: cycle }
          - { label: Страница гастролей (архив), value: archive-page }
          - { label: Оглавление дисков, value: disks-index }
          - { label: Оглавление книг, value: books-index }
          - { label: Другие проекты, value: other-projects }
      - label: Параметры
        name: params
        widget: object
        collapsed: true
        fields:
          - { label: id записи в Directus, name: id, widget: string, required: false, hint: "sets.id (диск, кассета), books.id (книга), cycles.id (цикл); у страниц гастролей пусто. У существующих страниц не менять" }
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - *seotitle
          - *menudate
          - *menudatefrom
      - *seodesc
      - *datefield
      - *typefield
      - { label: Текст, name: body, widget: markdown, modes: [raw], required: false }

  # Страницы картинок (шаблон images-page): тело — HTML; картинки лежат в static/Images, на страницах на них ссылаются
  # просто по имени файла ("afish1.jpg"). Кнопка вставки картинки пишет адрес от корня домена
  # (/Images/…), который на github.io (сайт в подпапке /shcherbakov/) не открывается — вписывать имя файла вручную.
  # Переадресации со старых адресов (content/Images/redirects) в коллекцию не входят: вложенные папки не читаются,
  # и у них другой шаблон. Создание и удаление — как у статей.
  - name: images
    label: Картинки (Images)
    label_singular: Страница картинок
    folder: content/Images
    extension: md
    format: json-frontmatter
    create: true
    delete: false
    duplicate: false
    slug: { editable: [create] }   # имя файла вводится только при создании; адрес страницы — её url
    filter: { field: layout, value: images-page }
    summary: "{{title}} · {{filename}}"
    preview_path: "shcherbakov{{fields.url}}"
    fields:
      - { label: Заголовок, name: title, widget: string }
      - label: Параметры
        name: params
        widget: object
        fields:
          - { label: Подзаголовок, name: subtitle, widget: string, required: false }
          - { label: Ссылка «назад» — адрес, name: parentUrl, widget: string, required: false, default: Images/index.html }
          - { label: Ссылка «назад» — подпись, name: parentTitle, widget: string, required: false, default: Картинки }
          - { label: Цвет фона, name: bgColor, widget: string, required: false, hint: "CSS-цвет, напр. #DDC5A4; пусто — цвет по умолчанию (khaki)" }
          - { label: Текст по центру, name: centerText, widget: boolean, required: false }
          - *seotitle
          - *menudate
          - *menudatefrom
      - *seodesc
      - *datefieldnew
      - { label: layout, name: layout, widget: hidden, required: false, default: images-page }
      - *typefield
      - *articlebody

  # Языковая группа (страницы языков и переводы) отбита в левой панели разделителем (вложенных разделов в Sveltia нет)
  - divider: true


  # Страницы языков: тело — HTML; меню, подписи и прочие настройки заголовка правятся в файле
  - name: language-pages
    label: Страницы языков
    format: json-frontmatter
    files:
      - { name: en-index, preview_path: "shcherbakov/en/index.html", label: English — главная, file: content/en/en-index.md, fields: &pagefields [ { label: Заголовок, name: title, widget: string }, { label: Параметры, name: params, widget: object, collapsed: true, fields: [ *seotitle ] }, *seodesc, { label: Текст (HTML), name: body, widget: markdown, modes: [raw] } ] }
      - { name: en-translations, preview_path: "shcherbakov/en/translations.html", label: English — список переводов, file: content/en/en-translations.md, fields: *pagefields }
      - { name: de-index, preview_path: "shcherbakov/de/index.html", label: Deutsch — главная, file: content/de/de-index.md, fields: *pagefields }
      - { name: de-translations, preview_path: "shcherbakov/de/translations.html", label: Deutsch — список переводов, file: content/de/de-translations.md, fields: *pagefields }
      - { name: uk-index, preview_path: "shcherbakov/uk/index.html", label: Українська — главная, file: content/uk/uk-index.md, fields: *pagefields }
      - { name: uk-translations, preview_path: "shcherbakov/uk/translations.html", label: Українська — список переводов, file: content/uk/uk-translations.md, fields: *pagefields }
      - { name: fr-index, preview_path: "shcherbakov/fr/index.html", label: Français — главная, file: content/fr/fr-index.md, fields: *pagefields }
      - { name: fr-translations, preview_path: "shcherbakov/fr/translations.html", label: Français — список переводов, file: content/fr/fr-translations.md, fields: *pagefields }
      - { name: fr-ostromoukhov, preview_path: "shcherbakov/fr/ostromoukhov-2000.html", label: Français — мемуар Б. Остромуховой, file: content/fr/ostromoukhov-2000.md, fields: *pagefields }
      - { name: eo-index, preview_path: "shcherbakov/eo/index.html", label: Esperanto — главная, file: content/eo/eo-index.md, fields: *pagefields }
      - { name: eo-translations, preview_path: "shcherbakov/eo/translations.html", label: Esperanto — список переводов, file: content/eo/eo-translations.md, fields: *pagefields }
      - { name: he-index, preview_path: "shcherbakov/he/index.html", label: עברית — главная, file: content/he/he-index.md, fields: *pagefields }
      - { name: he-translations, preview_path: "shcherbakov/he/translations.html", label: עברית — список переводов, file: content/he/he-translations.md, fields: *pagefields }


  # Переводы: content/<язык>/<id>.md — одна коллекция на все языки, в левой панели — папки языков. Отбор — по пустому
  # layout: он есть у страниц языков, у подвала главной и других служебных страниц, у переводов — нет
  - name: translations
    label: Переводы
    label_singular: Перевод
    folder: content
    nested: { depth: 2, subfolders: false }
    extension: md
    format: json-frontmatter
    create: false
    delete: false
    duplicate: false
    slug: { editable: false }   # имя файла = id записи в Directus: не переименовывать
    filter: { field: layout, value: null }
    summary: "{{filename}}"
    preview_path: "shcherbakov/{{dirname}}/{{filename}}.html"
    fields:
      # только для фильтра (пустое не записывается)
      - { label: layout, name: layout, widget: hidden, required: false }
      - { label: Дата публикации, name: lastmod, widget: datetime, time_format: false, required: false, hint: "Когда перевод опубликован на сайте; по самому свежему — дата «Каталога переводов» в меню. Пусто — даты нет" }
      - { label: Текст, name: body, widget: text }
